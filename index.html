<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripSnap - Ton itinéraire de voyage en 60 secondes</title>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1e3c72, #2a5298); color: #fff; min-height: 100vh; }
  .container { max-width: 680px; margin: 0 auto; padding: 40px 20px; }
  header { text-align: center; margin-bottom: 30px; }
  header h1 { font-size: 2.2rem; margin-bottom: 10px; }
  header p { opacity: 0.85; font-size: 1rem; }
  .card { background: rgba(255,255,255,0.08); border-radius: 16px; padding: 24px; margin-bottom: 20px; backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.15); }
  label { display: block; margin: 12px 0 6px; font-size: 0.9rem; opacity: 0.9; }
  input, select { width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 1rem; }
  button { width: 100%; padding: 14px; margin-top: 20px; border: none; border-radius: 10px; background: #ffcc00; color: #1e3c72; font-weight: bold; font-size: 1.05rem; cursor: pointer; transition: transform 0.15s; }
  button:hover { transform: scale(1.02); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #result { white-space: pre-wrap; line-height: 1.6; font-size: 0.95rem; }
  .badge { display: inline-block; background: #ffcc00; color: #1e3c72; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; }
  .locked { text-align: center; padding: 30px; }
  .locked p { margin-bottom: 16px; opacity: 0.9; }
  .price { font-size: 2rem; font-weight: bold; color: #ffcc00; }
  #authBox input { margin-bottom: 10px; }
  .small { font-size: 0.8rem; opacity: 0.7; margin-top: 10px; }
  .error { color: #ff8080; margin-top: 10px; font-size: 0.9rem; }
  footer { text-align: center; opacity: 0.6; font-size: 0.8rem; margin-top: 40px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>TripSnap ✈️</h1>
    <p>Ton itinéraire de voyage complet, généré en 60 secondes.</p>
  </header>

  <div class="card">
    <span class="badge">Étape 1</span>
    <label for="destination">Destination</label>
    <input type="text" id="destination" placeholder="ex: Bali, Tokyo, Lisbonne">

    <label for="jours">Nombre de jours</label>
    <input type="number" id="jours" value="7" min="1" max="30">

    <label for="budget">Budget total (€)</label>
    <input type="number" id="budget" value="800">

    <label for="style">Style de voyage</label>
    <select id="style">
      <option value="backpack">Backpack / petit budget</option>
      <option value="confort">Confort</option>
      <option value="luxe">Luxe</option>
      <option value="instagram">Spots Instagram / photo</option>
    </select>

    <button id="generateBtn">Générer mon itinéraire gratuit (aperçu)</button>
    <div id="genError" class="error"></div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <span class="badge">Aperçu</span>
    <div id="result"></div>
    <div class="locked" id="lockedZone">
      <p>Débloque l'itinéraire complet jour par jour, le budget détaillé et les adresses exactes.</p>
      <div class="price">29€</div>
      <p class="small">Paiement unique, accès à vie à cet itinéraire</p>
      <div id="authBox">
        <input type="email" id="email" placeholder="Ton email">
        <button id="payBtn">Débloquer maintenant (29€)</button>
      </div>
      <div id="payError" class="error"></div>
    </div>
  </div>

  <footer>TripSnap © 2024. Voyage plus intelligemment.</footer>
</div>

<script>
  const supabase = window.supabase.createClient(window.ENV.SUPABASE_URL, window.ENV.SUPABASE_ANON_KEY);

  function buildFakeItinerary(destination, jours, budget, style) {
    const styles = {
      backpack: "auberges et street food",
      confort: "hôtels 3 étoiles et restos locaux",
      luxe: "hôtels 5 étoiles et expériences premium",
      instagram: "spots photo incontournables"
    };
    let preview = `Itinéraire ${jours} jours à ${destination}\nStyle: ${styles[style] || style}\nBudget estimé: ${budget}€\n\n`;
    preview += `Jour 1: Arrivée et découverte du centre-ville\n`;
    preview += `Jour 2: Visite des sites principaux (aperçu limité)\n`;
    preview += `...\n\n🔒 ${jours - 2} jours restants verrouillés, budget détaillé jour par jour, adresses exactes et bons plans locaux.`;
    return preview;
  }

  document.getElementById('generateBtn').addEventListener('click', () => {
    const destination = document.getElementById('destination').value.trim();
    const jours = parseInt(document.getElementById('jours').value) || 7;
    const budget = document.getElementById('budget').value;
    const style = document.getElementById('style').value;
    const errorEl = document.getElementById('genError');

    if (!destination) {
      errorEl.textContent = "Indique une destination.";
      return;
    }
    errorEl.textContent = "";

    const preview = buildFakeItinerary(destination, jours, budget, style);
    document.getElementById('result').textContent = preview;
    document.getElementById('resultCard').style.display = 'block';

    // Sauvegarde de la demande dans Supabase pour suivi
    supabase.from('trip_requests').insert({
      destination, jours, budget: Number(budget) || 0, style
    }).then(() => {}).catch(() => {});
  });

  document.getElementById('payBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const payError = document.getElementById('payError');
    if (!email || !email.includes('@')) {
      payError.textContent = "Entre un email valide.";
      return;
    }
    payError.textContent = "";

    const destination = document.getElementById('destination').value.trim();

    // Enregistre la demande d'achat (à connecter à un vrai lien Stripe Payment Link ensuite)
    const { error } = await supabase.from('trip_orders').insert({
      email, destination, status: 'pending'
    });

    if (error) {
      payError.textContent = "Erreur, réessaie dans un instant.";
      return;
    }

    // Redirection vers le lien de paiement Stripe (à remplacer par ton propre lien)
    window.location.href = "https://buy.stripe.com/REMPLACE_PAR_TON_LIEN";
  });
</script>
</body>
</html>
